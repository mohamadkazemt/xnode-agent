name: finalize-v1

on:
  push:
    branches:
      - agent/v1.0-complete-node
    paths:
      - '.finalize/**'
      - '.github/workflows/finalize-v1.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct audited source
        shell: bash
        run: |
          set -euo pipefail
          cat .finalize/chunk-* > /tmp/xnode-v1.b64
          base64 -d /tmp/xnode-v1.b64 > /tmp/xnode-v1.tgz
          echo 'f50874b044cb97065a9ab6c039823b4e7353f6f3faef7580df4ced66ab1366ae  /tmp/xnode-v1.tgz' | sha256sum -c -
          tar -xzf /tmp/xnode-v1.tgz -C .
          rm -rf .finalize .github/workflows/finalize-v1.yml

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Validate agent
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          go build ./cmd/xnode-agent
          bash -n scripts/install.sh
          python3 - <<'PY'
          import pathlib
          try:
              import yaml
          except ImportError:
              raise SystemExit('PyYAML is required on the runner for workflow syntax validation')
          for path in pathlib.Path('.github/workflows').glob('*.yml'):
              with path.open() as f:
                  yaml.safe_load(f)
              print('validated', path)
          PY

      - name: Build official Xray pin with xnode overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/xray-v26.7.28
          git clone --depth 1 --branch v26.7.28 https://github.com/XTLS/Xray-core.git /tmp/xray-v26.7.28
          cp patches/xray-v26.7.28/xnode_limiter.go.txt /tmp/xray-v26.7.28/app/dispatcher/xnode_limiter.go
          cp patches/xray-v26.7.28/xnode_limiter_test.go.txt /tmp/xray-v26.7.28/app/dispatcher/xnode_limiter_test.go
          python3 patches/xray-v26.7.28/patch_default.py /tmp/xray-v26.7.28/app/dispatcher/default.go
          cd /tmp/xray-v26.7.28
          go test ./app/dispatcher
          go build -trimpath -o xray ./main

      - name: End-to-end Xray runtime test
        shell: bash
        env:
          XRAY_BIN: /tmp/xray-v26.7.28/xray
        run: go test ./internal/xray -run TestXrayE2ERuntime -count=1 -v

      - name: Commit audited v1.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize v1.0 audit hardening'
          git push origin HEAD:agent/v1.0-complete-node
