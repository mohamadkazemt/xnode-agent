name: installer
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl python3 shellcheck
      - name: Static checks
        run: |
          bash -n scripts/install.sh scripts/uninstall.sh scripts/xnode
          shellcheck scripts/install.sh scripts/uninstall.sh scripts/xnode
      - name: Management menu smoke test
        run: |
          bash scripts/xnode help
          test "$(printf '0\n' | XNODE_ALLOW_NO_SYSTEMD=1 bash scripts/xnode | grep -c 'XNode Agent Management')" -eq 1
      - name: Smoke install release without systemd
        shell: bash
        run: |
          if ! output=$(bash scripts/install.sh --version v1.0.1 --node-id ci-node --panel-url https://panel.example.com --panel-token CI_ONLY_TOKEN --force --no-start 2>&1); then
            output=${output//'%'/'%25'}
            output=${output//$'\n'/'%0A'}
            output=${output//$'\r'/'%0D'}
            echo "::error title=Installer smoke failed::$output"
            exit 1
          fi
      - name: Verify installed files and permissions
        run: |
          test -x /usr/local/bin/xnode-agent
          test -x /usr/local/bin/xray
          test "$(stat -c %a /etc/xnode/agent.json)" = 600
          test "$(stat -c %a /etc/xnode)" = 700
          test -s /usr/local/bin/xnode-agent
      - name: Exercise settings redaction and safe config editor
        shell: bash
        run: |
          menu_tmp=$(mktemp -d)
          trap 'rm -rf "$menu_tmp"' EXIT
          cp /etc/xnode/agent.json "$menu_tmp/agent.json"
          chmod 0600 "$menu_tmp/agent.json"
          settings=$(XNODE_CONFIG_PATH="$menu_tmp/agent.json" bash scripts/xnode settings)
          grep -F 'panel_token: configured (redacted)' <<<"$settings"
          if grep -F 'CI_ONLY_TOKEN' <<<"$settings"; then
            echo 'management command exposed the panel token' >&2
            exit 1
          fi
          printf '\n\n\n5\n' | XNODE_CONFIG_PATH="$menu_tmp/agent.json" bash scripts/xnode configure
          python3 - "$menu_tmp/agent.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle: data=json.load(handle)
          assert data["sync_seconds"] == 5
          assert data["panel_token"] == "CI_ONLY_TOKEN"
          PY
      - name: Verify patched Xray binary
        run: |
          /usr/local/bin/xray version
      - name: Refuse config overwrite
        run: |
          if bash scripts/install.sh --version v1.0.1 --node-id ci-node \
            --panel-url https://panel.example.com --panel-token CI_ONLY_TOKEN --no-start; then
            echo 'installer unexpectedly overwrote config' >&2
            exit 1
          fi
      - name: Uninstall while preserving data
        run: |
          bash scripts/uninstall.sh
          test ! -e /usr/local/bin/xnode-agent
          test -e /etc/xnode/agent.json

