name: release-build
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  agent-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags='-s -w' -o xnode-agent-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/xnode-agent
      - uses: actions/upload-artifact@v4
        with:
          name: xnode-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: xnode-agent-${{ matrix.goos }}-${{ matrix.goarch }}
