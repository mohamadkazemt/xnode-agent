name: release-build
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout xnode-agent
        uses: actions/checkout@v4
        with:
          path: xnode
      - name: Checkout official Xray pin
        uses: actions/checkout@v4
        with:
          repository: XTLS/Xray-core
          ref: v26.7.28
          path: xray
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Overlay and test xnode limiter
        run: |
          cp xnode/patches/xray-v26.7.28/xnode_limiter.go.txt xray/app/dispatcher/xnode_limiter.go
          cp xnode/patches/xray-v26.7.28/xnode_limiter_test.go.txt xray/app/dispatcher/xnode_limiter_test.go
          python3 xnode/patches/xray-v26.7.28/patch_default.py xray/app/dispatcher/default.go
          (cd xray && go test ./app/dispatcher)
      - name: Build Linux binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          (cd xnode && go build -trimpath -ldflags='-s -w' -o ../xnode-agent ./cmd/xnode-agent)
          (cd xray && go build -trimpath -ldflags='-s -w' -o ../xray-bin ./main)
          mkdir -p dist
          mv xnode-agent dist/xnode-agent
          mv xray-bin dist/xray
          cp xnode/VERSION dist/VERSION
          cp xnode/scripts/xnode dist/xnode
          cp xnode/scripts/uninstall.sh dist/xnode-uninstall
          chmod 0755 dist/xnode dist/xnode-uninstall
          tar -C dist -czf xnode-v${GITHUB_REF_NAME#v}-linux-${{ matrix.goarch }}.tar.gz xnode-agent xray xnode xnode-uninstall VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: xnode-linux-${{ matrix.goarch }}
          path: xnode-v*-linux-${{ matrix.goarch }}.tar.gz
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: xnode-linux-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --generate-notes --verify-tag
          fi
